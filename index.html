        <script>
            const projects = [
                {
                    title: "MINITEL",
                    info: "Interfacing with an old Alcatel Minitel 1 laptop using it serial communication port to display my Trello todolist",
                    year: "2024",
                    image: "https://daily.jstor.org/wp-content/uploads/2017/05/minitel_1050x700.jpg",
                    link: "./projects/project.html?project=minitel"
                },
                {
                    title: "Rotulo",
                    info: "Custom Spotify interface",
                    year: "2025",
                    image: "https://images.pexels.com/photos/1389429/pexels-photo-1389429.jpeg?cs=srgb&dl=pexels-ellis-1389429.jpg&fm=jpg",
                    link: "./projects/project.html?project=spotify"
                },
                {
                    title: "DJ Controller",
                    info: "Custom 3D printed MIDI controller",
                    year: "2025",
                    image: "https://media.istockphoto.com/id/538479389/photo/dj-mixer-with-headphones.jpg?s=612x612&w=0&k=20&c=ugkWXMbcIJ5IlIb8uGXGJI_g2V1earxgERDVYF6NuEg=",
                    link: "./projects/project.html?project=dj-controller"
                },
                {
                    title: "Setup",
                    info: "Designing and building a desk",
                    year: "2024",
                    image: "https://silentnoise.ph/wp-content/uploads/2023/01/5-32.jpg",
                    link: "./projects/project.html?project=setup"
                },
            ]

            const itemsContainer = document.getElementById("projects");

            // Semi dynamic site generation
            document.addEventListener("DOMContentLoaded", function () {
                projects.forEach(project => {
                    const element = document.createElement("div");
                    element.href = project.link || "#";
                    element.className = "col-lg-4 col-md-6 col-12 my-4";
                    itemsContainer.appendChild(element);

                    element.innerHTML = `
                        <div class="row">
                            <div class="col-auto"><b>Projects</b> | ${project.title}</div>
                            <div class="col"></div>
                            <div class="col-auto d-none d-lg-inline">${project.year}</div>
                        </div>
                        
                        <div class="ratio my-2" style="--bs-aspect-ratio: 50%;">
                            <img src="${project.image}"
                                class="rounded object-fit-cover project-image">
                        </div>
                        <div class="text-muted ">
                            ${project.info}<br><a class="text-dark text-decoration-none" href="${project.link}">more &rarr;</a>
                        </div>
                    `;
                });
            });
        </script>
