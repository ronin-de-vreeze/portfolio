<doctype html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>App</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
            /* @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap'); */
            @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Outfit:wght@100..900&display=swap');

            /* Set font */
            *,
            html {
                font-family: "Outfit", sans-serif;
                font-optical-sizing: auto;
                font-style: normal;
            }

            .img>img {
                filter: grayscale(100%) contrast(120%) brightness(100%);
            }

            .img>#grain {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-size: 10%;
                background-image: url('https://upload.wikimedia.org/wikipedia/commons/f/f6/White-noise-mv255-240x180.png');
                opacity: 1;
                mix-blend-mode: overlay;
            }
        </style>
    </head>

    <body>
        <!-- Banner -->
        <div class="row img" style="position: relative;">
            <!-- Image -->
            <img id="header-image" class="img-fluid object-fit-cover"
                style="height: 60vh;">

            <!-- Grain -->
            <div id="grain"></div>

            <!-- Absolute position title -->
            <div class="row justify-content-center" style="position: absolute; bottom: 0px; left: 0px;">
                <!-- Title -->
                <div id="title" class="col-10" style="font-family: 'Bodoni Moda'; font-size: 10rem; color: white; "></div>
            </div>
        </div>

        <!-- Back button -->
        <a class="btn rounded-0 bg-white text-dark" style="position: fixed; top: 16px; left: 16px;"
            href="../index.html">&larr; Projects</a>

        <!-- Container -->
        <div class="container-fluid py-5">
            <!-- Info header -->
            <div class="row justify-content-center mb-5">
                <!-- 10 col wide container -->
                <div class="col-10 row justify-content-between mb-5">
                    <!-- Description subtitle -->
                    <div id="subtitle" class="col-md-6 col-12 pb-4"></div>

                    <!-- Infobox -->
                    <div id="infobox" class="col-md-4 col-12">
                        
                    </div>
                </div>
            </div>

            <!-- Content -->
            <div class="row justify-content-center">
                <!-- Centered box -->
                <div class="col-10 row justify-content-between">
                    <!-- Text sections -->
                    <div id="text-sections" class="col-md-8 col-12"></div>

                    <!-- Images -->
                    <div class="col-md-4 col-12" id="images"></div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

        <script src="./pageBuilder.js"></script>
    </body>

    </html>
