<!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ronin de Vreeze | Project</title>
        <link rel="icon" type="image/x-icon" href="../images/favicon.svg">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
            /* @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap'); */
            @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Outfit:wght@100..900&display=swap');

            /* Set font */
            *,
            html {
                font-family: "Outfit", sans-serif;
                font-optical-sizing: auto;
                font-style: normal;

                --primary-bg-color: #010101;
                --primary-color: #ffffff;
                --primary-muted: #555555;
            }

            ::-webkit-scrollbar {
                display: none;
            }

            body {
                background-color: black;
                color: white;
            }

            #header-image {
                filter: brightness(200%) grayscale(100%) contrast(3000%) saturate(200%);
            }

            #title {
                /* color: white; */
                font-weight: 900;
                mix-blend-mode: difference;
            }

            
            #grain {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-size: 10%;
                background-image: url('https://upload.wikimedia.org/wikipedia/commons/f/f6/White-noise-mv255-240x180.png');
                opacity: 50%;
                mix-blend-mode: overlay;
            }
        </style>
    </head>

    <body>
        <!-- Banner -->
        <div class="row p-0 m-0" style="position: relative;">
            <!-- Image -->
            <img id="header-image" class="img-fluid object-fit-cover" style="height: 60vh;">

            <!-- Grain -->
            <div id="grain"></div>

            <!-- Absolute position title -->
            <div class="row justify-content-center" style="position: absolute; bottom: 0%; left: 0px;">
                <div id="title" class="col-12 col-xl-6" style="font-family: 'Bodoni Moda'; font-size: 10rem;">Project not found</div>
            </div>
        </div>

        <!-- Back button -->
        <a class="btn rounded-0 bg-white text-dark" style="position: fixed; top: 16px; left: 16px;"
            href="../index.html">&larr; Projects</a>

        <!-- Container -->
        <div class="container-fluid py-5">
            <!-- Info header -->
            <div class="row justify-content-center">
                <!-- 8 col wide container -->
                <div class="col-12 col-xl-6">
                    <div id="infobox" class="d-flex justify-content-between" style="margin-bottom: 200px;">
                    </div>

                    <!-- Content -->
                    <div id="content" class="mb-5">
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

        <script src="./pageBuilder.js"></script>
    </body>

    </html>
